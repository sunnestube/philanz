<p-toolbar class="app-toolbar">
    <div class="bar">
        <a routerLink="/" class="brand" [attr.aria-label]="title">
            <span class="brand-mark">Φ</span>
            <span class="brand-name">{{ title }}</span>
        </a>
        <nav class="nav">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <div class="year-group">
                <a routerLink="/year" routerLinkActive="active">Jahresübersicht</a>
                <select class="year-select"
                        [value]="currentYear()"
                        (change)="onPickYear($event)"
                        aria-label="Jahr wählen">
                    @for (item of years(); track item.id) {
                        <option [value]="item.id">{{ item.name }}</option>
                    }
                </select>
                <button type="button" class="year-add" (click)="newYear()" title="Neues Jahr">+</button>
            </div>
            <a routerLink="/pack/total" routerLinkActive="active">Total</a>
            <a routerLink="/pack/graf" routerLinkActive="active">Graf</a>
            <a routerLink="/set" routerLinkActive="active">Set</a>
            <!--
            <a routerLink="/biltanz" routerLinkActive="active">Biltanz</a>
            <a routerLink="/about" routerLinkActive="active">Über uns</a>
            -->
        </nav>
        <div class="tools">
            @if (onYear()) {
                <button type="button"
                        class="icon-btn"
                        [class.on]="workbook.saldoColumnsOpen()"
                        (click)="workbook.toggleSaldoColumns()"
                        title="Saldo-Spalten">S</button>
                <button type="button"
                        class="icon-btn"
                        [class.on]="workbook.saldoPanelOpen()"
                        (click)="workbook.toggleSaldoPanel()"
                        title="Saldo-Box">▣</button>
            }
            <button type="button" class="icon-btn" (click)="openSettings()" title="Einstellungen">⚙</button>
        </div>
    </div>
</p-toolbar>
<bal-settings-dialog/>

<div class="tab-container">
    @if (months && selectedMonth) {
        @for (month of months; track month) {
            <div class="tab-content" [class.active]="selectedMonth === month">
                <bal-month [month]="month"></bal-month>
            </div>
        }

        <div class="tabs">
            @for (month of months; track month) {
                <div class="tab-label"
                     [class]="month.label.background"
                     [class.active]="selectedMonth === month"
                     (click)="selectTab(month)">
                    {{ month.label.title }}
                </div>
            }
        </div>
        <div class="year-actions">
            <p-button
                label="Speichern"
                ariaLabel="Speichern"
                severity="secondary"
                outlined="true"
                size="small"
                (onClick)="save()">
            </p-button>
            <p-button
                label="CSV exportieren"
                ariaLabel="CSV exportieren"
                severity="secondary"
                outlined="true"
                size="small"
                (onClick)="exportToCSV()">
            </p-button>
        </div>
    }
    <bal-import (dataLoaded)="import($event)"></bal-import>
</div>

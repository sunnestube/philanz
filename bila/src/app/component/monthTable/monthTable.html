@if (month) {
    <bal-formula-bar
        [draft]="edit.draft"
        [activeAddress]="edit.activeAddress"
        [active]="edit.formulaMode || edit.refPickMode"
        [colorize]="edit.showRefColors()"
        [placeholder]="edit.formulaPlaceholder()"
        [tokens]="edit.formulaTokens()"
        (formulaFocus)="edit.enterRefPick()"
        (formulaInput)="edit.onFormulaInput($event)"
        (formulaKeydown)="edit.onFormulaKeydown($event)"
        (formulaCopy)="onBarCopy($event)"
        (formulaPaste)="onBarPaste($event)"
        (formulaBlur)="edit.onFormulaBlur()"
    />
    <div class="table-scroll"
         #scroller
         [class.dragging]="panning"
         (pointerdown)="pointer.onPanStart($event)"
         (pointerup)="edit.endDrag()"
         (pointercancel)="edit.endDrag()">
        <table class="data-table">
            <thead balMonthHeader
                   [columns]="columnViews()"
                   [saldos]="saldoHeader()"
                   [showSaldo]="showSaldo()"
                   [showTotal]="workbook.saldoTotalVisible()"
                   [totalTitle]="workbook.saldoTotalTitle()"
                   (headerResize)="pointer.onHeaderResizeStart($event)"
                   (textResize)="pointer.onTextResizeStart($event)"></thead>
            <tbody>
                @for (row of month.rows; track $index; let rowIndex = $index) {
                    <tr [class]="row.color">
                        @for (cell of row.cells; let colIndex = $index; track colIndex) {
                            <td balMonthCell
                                [cell]="cell"
                                [cssType]="cellCss(cell)"
                                [isSelect]="isSelect(cell)"
                                [isIndex]="isIndex(cell)"
                                [isFormula]="isFormula(cell)"
                                [editing]="isEditing(rowIndex, colIndex)"
                                [refTarget]="edit.refPickMode && !isEditing(rowIndex, colIndex)"
                                [refColor]="refColorFor(rowIndex, colIndex)"
                                [display]="cellDisplay(cell, rowIndex, colIndex)"
                                [cellId]="cellId(rowIndex, colIndex)"
                                [options]="isSelect(cell) ? optionsFor(cell) : noOptions"
                                [rowIndex]="rowIndex"
                                [selected]="edit.inRange(rowIndex, colIndex)"
                                (cellMouseDown)="edit.onCellMouseDown($event, rowIndex, colIndex)"
                                (cellEnter)="edit.onCellEnter(rowIndex, colIndex)"
                                (cellDblClick)="edit.startEdit(rowIndex, colIndex, cell)"
                                (selectChange)="onSelectChange(cell, row)"
                                (selectNavigate)="edit.onKeydown($event, rowIndex, colIndex, cell)"
                                (valueFocus)="edit.selectCell(rowIndex, colIndex, cell)"
                                (valueInput)="edit.onCellInput($event, cell)"
                                (valueBlur)="edit.onCellBlur(cell)"
                                (valueKeydown)="edit.onKeydown($event, rowIndex, colIndex, cell)"
                                (copy)="edit.onCopy($event, rowIndex, colIndex, cell)"
                                (paste)="edit.onPaste($event, rowIndex, colIndex, cell)"></td>
                        }
                        @if (showSaldo()) {
                            @for (item of saldo.rowSaldos(saldoHeader(), rowIndex); track item.key) {
                                <td balSaldoCell [vm]="item"></td>
                            }
                            @if (saldo.rowTotal(rowIndex); as total) {
                                <td balSaldoCell [vm]="total"></td>
                            }
                        }
                    </tr>
                }
                <tr class="foot-spacer" aria-hidden="true">
                    <td [attr.colspan]="month.columns.length + saldo.extraColCount()"
                        [style.height.px]="saldo.footerRows().length * 20"></td>
                </tr>
            </tbody>
            <tfoot balMonthFooter
                   [rows]="saldo.footerViews(columnViews(), saldoHeader())"
                   [showSaldo]="showSaldo()"
                   [showTotal]="workbook.saldoTotalVisible()"></tfoot>
        </table>
    </div>
}

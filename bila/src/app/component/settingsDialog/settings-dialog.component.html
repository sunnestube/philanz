<p-dialog header="Einstellungen"
          styleClass="settings-dialog"
          maskStyleClass="settings-mask"
          appendTo="body"
          [(visible)]="visible"
          [modal]="true"
          [dismissableMask]="true"
          [closable]="true"
          [style]="{width: 'min(920px, 96vw)', background: '#ffffff', color: '#0f172a'}">
    <div class="settings-tabs">
        <button type="button" [class.active]="tab === 'person'" (click)="tab = 'person'">Personen (C)</button>
        <button type="button" [class.active]="tab === 'account'" (click)="tab = 'account'">Konten (D)</button>
        <button type="button" [class.active]="tab === 'columns'" (click)="tab = 'columns'">Spalten</button>
        <button type="button" [class.active]="tab === 'saldo'" (click)="tab = 'saldo'">Saldo</button>
    </div>
    @if (tab === 'person') {
        <bal-settings-codes kind="person"
                            hint="Code bleibt in der Tabelle (Farbe, Formeln). Anzeigename erscheint in Saldospalten und Monatstotal."
                            namePlaceholder="z.B. Peter"/>
    }
    @if (tab === 'account') {
        <bal-settings-codes kind="account"
                            hint="Code bleibt in der Kontospalte. Anzeigename steht in den Saldoköpfen (z.B. Peter Bank)."
                            namePlaceholder="z.B. Bank"/>
    }
    @if (tab === 'columns') {
        <bal-settings-columns/>
    }
    @if (tab === 'saldo') {
        <bal-settings-saldo/>
    }
</p-dialog>

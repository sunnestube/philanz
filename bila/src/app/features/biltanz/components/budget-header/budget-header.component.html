<div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
    <h1 class="text-4xl font-bold text-slate-800 mb-2">
        Biltanz
    </h1>
    <p class="text-slate-600 mb-6">
        Jahresbudgets im CSV-Format importieren
    </p>

    <div class="flex items-center gap-4 mb-6">
        <label
            class="flex items-center gap-2 px-6 py-3 bg-blue-600 text-white rounded-lg cursor-pointer hover:bg-blue-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
            <span>CSV hochladen</span>
            <input
                type="file"
                accept=".csv"
                (change)="onFileChange($event)"
                class="hidden"
            />
        </label>

        @if (availableYears().length > 0) {
            <select
                [value]="selectedYear()"
                (change)="onYearChange($event)"
                class="px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
                @for (year of availableYears(); track year) {
                    <option [value]="year">{{ year }}</option>
                }
            </select>
        }
    </div>

    @if (error()) {
        <div class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
            {{ error() }}
        </div>
    }
</div>

<div class="card bg-white rounded-2xl shadow-xl p-6">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h2 class="text-xl font-bold text-slate-800">
            Monatliche Einnahmen vs Ausgaben – {{ month() }}
        </h2>

        <div class="flex gap-4">
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded bg-green-500"></div>
                <span class="text-sm text-slate-600">Einnahmen CHF</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded bg-red-500"></div>
                <span class="text-sm text-slate-600">Ausgaben CHF</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded bg-blue-500"></div>
                <span class="text-sm text-slate-600">Einnahmen BTC</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded bg-orange-500"></div>
                <span class="text-sm text-slate-600">Ausgaben BTC</span>
            </div>
        </div>
    </div>

    <p-chart
        type="bar"
        [data]="chartData"
        [options]="chartOptions"
        class="w-full h-80"
    ></p-chart>
</div>

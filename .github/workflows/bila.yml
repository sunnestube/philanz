name: bila

on:
  push:
    branches: [main, 'build/**']
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bila
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bila/package-lock.json
      - name: Assemble from _wb_parts
        run: node scripts/assemble-workbook.cjs
      - name: Assemble drift guard
        run: node scripts/check-assemble.cjs
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

@if (charts(); as data) {
<section class="year-graf">
    <div class="graf-head">
        <div>
            <h2>Graf</h2>
            <p>
                Obere Diagramme in {{ displayCode() }} plus Währungslinien (CHF links, FX rechts),
                sobald Kurse erfasst sind. Darunter der reine Ausgaben-Trend je Währung.
            </p>
        </div>
        <bal-currency-select/>
    </div>
    <div class="grid">
        <figure>
            <figcaption>Ausgaben pro Person und Monat ({{ displayCode() }})</figcaption>
            <p-chart type="bar" [data]="data.personStack" [options]="lineOptions"/>
        </figure>
        <figure>
            <figcaption>Ausgaben nach Kategorie ({{ displayCode() }})</figcaption>
            <p-chart type="bar" [data]="data.categoryStack" [options]="lineOptions"/>
        </figure>
        <figure class="wide">
            <figcaption>Einnahmen vs. Ausgaben ({{ displayCode() }})</figcaption>
            <p-chart type="bar" [data]="data.incomeExpense" [options]="lineOptions"/>
        </figure>
        @if (dualBarCharts(); as dual) {
            <figure class="wide">
                <figcaption>Vergleich CHF vs. {{ displayCode() }} (eigene Y-Achsen links/rechts)</figcaption>
                <p-chart type="line" [data]="dual" [options]="lineOptions"/>
            </figure>
        }
        @if (fxTrend(); as trend) {
            @if (trend.datasets.length > 1) {
                <figure class="wide">
                    <figcaption>Ausgaben-Trend: CHF (links) vs. Fremdwährungen (rechts)</figcaption>
                    <p-chart type="line" [data]="trend" [options]="lineOptions"/>
                </figure>
            }
        }
    </div>
</section>
}

<div class="year-shell">
    <div class="tab-container">
        @if (workbook.months().length && workbook.selectedMonth()) {
            @for (month of workbook.months(); track month) {
                <div class="tab-content" [class.active]="workbook.selectedMonth() === month">
                    <bal-month [month]="month"></bal-month>
                </div>
            }

            <div class="tabs">
                @for (month of workbook.months(); track month) {
                    <div class="tab-label"
                         [class]="month.label.background"
                         [class.active]="workbook.selectedMonth() === month"
                         (click)="selectTab(month)">
                        {{ month.label.title }}
                    </div>
                }
            </div>
            <div class="year-actions">
                <p-button label="Speichern" size="small" (onClick)="save()"/>
                <p-button label="CSV exportieren" size="small" (onClick)="exportToCSV()"/>
                <p-button label="Beispiel-CSV laden" size="small" (onClick)="loadExample()"/>
            </div>
        }
        <bal-import (dataLoaded)="import($event)"></bal-import>
    </div>
    @if (workbook.months().length) {
        <bal-saldo-panel/>
    }
</div>

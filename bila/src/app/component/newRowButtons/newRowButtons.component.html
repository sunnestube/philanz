@if (month || workbookHasMonth()) {
    <div class="row-actions">
        <p-button
            label="+ Zeile"
            icon="pi pi-plus"
            severity="success"
            size="small"
            ariaLabel="Neue Zeile hinzufügen"
            (onClick)="addRow()">
        </p-button>
        <p-button
            label="+ 20"
            icon="pi pi-plus-circle"
            severity="info"
            [outlined]="true"
            size="small"
            ariaLabel="Zwanzig Zeilen hinzufügen"
            (onClick)="addRows(20)">
        </p-button>
    </div>
}

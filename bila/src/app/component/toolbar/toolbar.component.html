<p-toolbar class="bg-gradient-to-r from-indigo-50 via-white to-teal-50 border-b border-gray-200 shadow-md">
    <div class="flex items-center justify-between w-full px-8 py-4">
        <a routerLink="/" class="flex items-center space-x-3 group">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-teal-500 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-xl transition-shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
            </div>
            <span class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-teal-600 bg-clip-text text-transparent">
        {{ title }}
      </span>
        </a>
        <div class="flex items-center space-x-1">
            <p-button label="Home" routerLink="/" routerLinkActive="active-nav" [routerLinkActiveOptions]="{ exact: true }" [rounded]="true" styleClass="p-button-text p-button-rounded font-medium text-gray-700 hover:bg-indigo-100 hover:text-indigo-700 transition-all duration-200 px-6 py-3" ariaLabel="Home"></p-button>
            <span class="text-gray-300 mx-2">|</span>
            <p-button label="Jahresübersicht" routerLink="/year" routerLinkActive="active-nav" [rounded]="true" styleClass="p-button-text p-button-rounded font-medium text-gray-700 hover:bg-indigo-100 hover:text-indigo-700 transition-all duration-200 px-6 py-3" ariaLabel="Jahresübersicht"></p-button>
            @if (onYear()) {
                <select class="year-select"
                        [value]="currentYear()"
                        (change)="onPickYear($event)"
                        aria-label="Jahr wählen">
                    @for (item of years(); track item.id) {
                        <option [value]="item.id">{{ item.name }}</option>
                    }
                </select>
                <button type="button" class="year-add" (click)="newYear()" title="Neues Jahr">+</button>
            }
            <span class="text-gray-300 mx-2">|</span>
            <p-button label="Biltanz" routerLink="/biltanz" routerLinkActive="active-nav" [rounded]="true" styleClass="p-button-text p-button-rounded font-medium text-gray-700 hover:bg-indigo-100 hover:text-indigo-700 transition-all duration-200 px-6 py-3" ariaLabel="Biltanz"></p-button>
            <span class="text-gray-300 mx-2">|</span>
            <p-button label="Über uns" routerLink="/about" routerLinkActive="active-nav" [rounded]="true" styleClass="p-button-text p-button-rounded font-medium text-gray-700 hover:bg-indigo-100 hover:text-indigo-700 transition-all duration-200 px-6 py-3" ariaLabel="Über uns"></p-button>
            @if (onYear()) {
                <p-button
                    icon="pi pi-table"
                    (onClick)="workbook.toggleSaldoColumns()"
                    [rounded]="true"
                    [title]="workbook.saldoColumnsOpen() ? 'Saldo-Spalten ausblenden' : 'Saldo-Spalten einblenden'"
                    styleClass="p-button-text p-button-rounded text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all duration-200 p-3 ml-2"
                    [class.saldo-on]="workbook.saldoColumnsOpen()"
                    ariaLabel="Saldo-Spalten ein/aus"></p-button>
                <p-button
                    icon="pi pi-th-large"
                    (onClick)="workbook.toggleSaldoPanel()"
                    [rounded]="true"
                    [title]="workbook.saldoPanelOpen() ? 'Saldo-Box ausblenden' : 'Saldo-Box einblenden'"
                    styleClass="p-button-text p-button-rounded text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all duration-200 p-3"
                    [class.saldo-on]="workbook.saldoPanelOpen()"
                    ariaLabel="Saldo-Box ein/aus"></p-button>
            }
            <p-button icon="pi pi-cog" (onClick)="openSettings()" [rounded]="true" styleClass="p-button-text p-button-rounded text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all duration-200 p-3 ml-2" ariaLabel="Einstellungen"></p-button>
        </div>
    </div>
</p-toolbar>
<bal-settings-dialog/>

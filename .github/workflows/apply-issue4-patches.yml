name: apply-issue4-patches
on:
  push:
    paths:
      - '.github/patches/issue4/00-READY'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2-month-table-virtualization-paste
          fetch-depth: 0
      - name: Apply Issue #4 patches and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in $(ls .github/patches/issue4/*.patch | sort); do
            echo "Applying $p"
            git apply "$p"
          done
          # cleanup helpers
          rm -rf .github/patches/issue4
          rm -f .github/patches/issue4-workbook.b64 \
                .github/patches/issue4-workbook.b64.a \
                .github/patches/issue4-workbook.b64.b \
                .github/patches/issue4-workbook.b64.c \
                .github/workflows/apply-issue4-workbook.yml \
                .github/workflows/apply-issue4-rest.yml \
                .github/workflows/apply-issue4-patches.yml
          rmdir .github/patches 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'MSG'
feat(table): MonthTableEdit undo/redo + Workbook history (Issue #4)

Command/inverse-diff TableHistoryService wiring: commit, paste, clear-range, select.
Ctrl/Cmd+Z undo; Ctrl/Cmd+Y and Ctrl/Cmd+Shift+Z redo. Depth 50, current month.
Native field undo while typing in cell/formula-bar.
MSG
)"
          git push origin HEAD:fix/issue-2-month-table-virtualization-paste

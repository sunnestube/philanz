name: apply-workbook-issue2
on:
  push:
    branches: [fix/issue-2-month-table-virtualization-paste]
    paths:
      - "bila/src/app/service/workbook.service.ts.patch"
      - ".github/workflows/apply-workbook-issue2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2-month-table-virtualization-paste
      - name: Apply workbook patch
        run: |
          set -euo pipefail
          patch -p0 < bila/src/app/service/workbook.service.ts.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bila/src/app/service/workbook.service.ts
          if git diff --cached --quiet; then
            echo "No changes after patch"
            exit 0
          fi
          git commit -m "refactor(workbook): explicit API replacing YearComponent monkey-patches"
          git push

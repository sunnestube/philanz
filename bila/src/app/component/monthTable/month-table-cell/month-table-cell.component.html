@if (isSelect()) {
    <select [(ngModel)]="cell().value"
            (change)="selectChange.emit()"
            (keydown)="onSelectArrowDown($event)"
            (keyup)="onSelectArrowUp($event)"
            (paste)="paste.emit($event)"
            (copy)="copy.emit($event)"
            [id]="cellId()"
            tabindex="0"
            [ngModelOptions]="{standalone: true}">
        @for (option of options(); track option) {
            <option [value]="option">{{ option }}</option>
        }
    </select>
} @else if (isIndex()) {
    <div [id]="cellId()"
         tabindex="0"
         class="row-head"
         (keydown)="valueKeydown.emit($event)"
         (copy)="copy.emit($event)"
         (paste)="paste.emit($event)">{{ rowIndex() + 1 }}</div>
} @else if (editing()) {
    <input
        #editInput
        [id]="cellId()"
        tabindex="0"
        [title]="isFormula() ? cell().raw : cell().type.id"
        [value]="display()"
        (input)="valueInput.emit($event)"
        (blur)="valueBlur.emit()"
        (keydown)="valueKeydown.emit($event)"
        (copy)="copy.emit($event)"
        (paste)="paste.emit($event)"
    />
} @else {
    <span
        class="cell-read"
        [id]="cellId()"
        tabindex="0"
        [title]="isFormula() ? cell().raw : cell().type.id"
        (focus)="valueFocus.emit()"
        (keydown)="valueKeydown.emit($event)"
        (copy)="copy.emit($event)"
        (paste)="paste.emit($event)"
    >{{ display() }}</span>
}

<div
    class="home-container min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center p-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-12 max-w-5xl w-full">

        <!-- Jahresübersicht Card -->
        <a routerLink="/year"
           class="group block transform transition-all duration-300 hover:-translate-y-3 hover:scale-105">
            <p-card
                styleClass="h-full overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border-0">
                <ng-template pTemplate="header">
                    <div
                        class="bg-gradient-to-br from-indigo-500 to-indigo-600 h-32 flex items-center justify-center rounded-t-2xl">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             class="h-20 w-20 text-white"
                             viewBox="0 0 24 24"
                             stroke="currentColor"
                             fill="none"
                             stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                </ng-template>

                <div class="p-8 text-center -mt-8">
                    <h2 class="text-3xl font-bold text-gray-800 group-hover:text-indigo-700 transition-colors duration-300">
                        Jahresübersicht
                    </h2>
                    <p class="mt-6 text-lg text-gray-600">
                        Alle Daten, Statistiken und Entwicklungen des Jahres im kompakten Überblick.
                    </p>
                </div>

                <ng-template pTemplate="footer">
                    <div class="text-center pb-6">
            <span class="text-indigo-600 font-medium group-hover:text-indigo-800 transition-colors">
              Jetzt ansehen →
            </span>
                    </div>
                </ng-template>
            </p-card>
        </a>

        <!-- Über uns Card -->
        <a routerLink="/about"
           class="group block transform transition-all duration-300 hover:-translate-y-3 hover:scale-105">
            <p-card class="h-full overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border-0">
                <ng-template pTemplate="header">
                    <div
                        class="bg-gradient-to-br from-teal-500 to-teal-600 h-32 flex items-center justify-center rounded-t-2xl">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             class="h-20 w-20 text-white"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </div>
                </ng-template>

                <div class="p-8 text-center -mt-8">
                    <h2 class="text-3xl font-bold text-gray-800 group-hover:text-teal-700 transition-colors duration-300">
                        Über uns
                    </h2>
                    <p class="mt-6 text-lg text-gray-600">
                        Erfahre mehr über unser Team, unsere Werte und unsere Mission.
                    </p>
                </div>

                <ng-template pTemplate="footer">
                    <div class="text-center pb-6">
            <span class="text-teal-600 font-medium group-hover:text-teal-800 transition-colors">
              Mehr erfahren →
            </span>
                    </div>
                </ng-template>
            </p-card>
        </a>

    </div>
</div>

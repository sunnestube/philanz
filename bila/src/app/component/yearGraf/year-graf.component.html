@if (charts(); as data) {
<section class="year-graf">
    <div class="graf-head">
        <div>
            <h2>Graf</h2>
            <p>
                Oben eine Säule je Einnahme/Ausgabe und Währung (CHF links, FX rechts).
                Darunter der Ausgaben-Trend als Linie.
            </p>
        </div>
        <bal-currency-select/>
    </div>
    <div class="grid">
        <figure>
            <figcaption>Ausgaben pro Person und Monat</figcaption>
            <p-chart type="bar" [data]="data.personStack" [options]="groupedOptions"/>
        </figure>
        <figure>
            <figcaption>Ausgaben nach Kategorie</figcaption>
            <p-chart type="bar" [data]="data.categoryStack" [options]="groupedOptions"/>
        </figure>
        <figure class="wide">
            <figcaption>Einnahmen vs. Ausgaben je Währung</figcaption>
            <p-chart type="bar" [data]="data.incomeExpense" [options]="groupedOptions"/>
        </figure>
        @if (fxTrend(); as trend) {
            @if (trend.datasets.length > 1) {
                <figure class="wide">
                    <figcaption>Ausgaben-Trend: CHF (links) vs. Fremdwährungen (rechts)</figcaption>
                    <p-chart type="line" [data]="trend" [options]="lineOptions"/>
                </figure>
            }
        }
    </div>
</section>
}

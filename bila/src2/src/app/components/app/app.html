<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <app-budget-header
            [availableYears]="availableYears()"
            [selectedYear]="selectedYear()"
            [error]="error()"
            (fileUploaded)="handleFileSelected($event)"
            (yearSelected)="selectYear($event)"
        />
        @if (currentYearData(); as months) {
            <app-monthly-detail-table
                [months]="months"
                [year]="selectedYear()"
                [expenseCategories]="expenseCategories"
                [incomeCategories]="incomeCategories"
            />
        }
        @if (currentYearData()) {
            <app-summary-cards [yearlyTotals]="yearlyTotals()"/>


            <app-monthly-overview
                [months]="currentYearData()"
                [year]="selectedYear()"
            />
        }
        @if (!currentYearData() && availableYears().length === 0) {
            <app-empty-state/>
        }
    </div>
</div>

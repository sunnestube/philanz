<div class="tabs">
    <div class="tab-label start-tab" [class.active]="view() === 'start'" (click)="openView.emit('start')">Start</div>
    <div class="tab-label constants-tab" [class.active]="view() === 'constants'" (click)="openView.emit('constants')">Konstanten</div>
    <div class="tab-label fx-tab-label" [class.active]="view() === 'fx'" (click)="openView.emit('fx')">Währungen</div>
    @for (month of months(); track month.label.title) {
        <div class="tab-label"
             [class]="month.label.background"
             [class.active]="view() === 'month' && selected() === month"
             [class.closed]="isMonthClosed(month)"
             [attr.title]="isMonthClosed(month) ? (month.label.title + ' — abgeschlossen') : month.label.title"
             (click)="selectMonth.emit(month)">
            {{ month.label.title }}
        </div>
    }
    <div class="tab-label total-tab" [class.active]="view() === 'total'" (click)="openView.emit('total')">Total</div>
    <div class="tab-label graf-tab" [class.active]="view() === 'graf'" (click)="openView.emit('graf')">Graf</div>
    <div class="tab-row-actions">
        <button type="button"
                class="close-toggle"
                [class.is-closed]="isYearClosed()"
                (click)="toggleYear()"
                [attr.title]="yearCloseLabel()"
                [attr.aria-label]="yearCloseLabel()">{{ yearCloseLabel() }}</button>
        @if (view() === 'month' && selected()) {
            <button type="button"
                    class="close-toggle"
                    [class.is-closed]="isMonthClosed(selected()!)"
                    (click)="toggleSelectedMonth()"
                    [attr.title]="monthCloseLabel()"
                    [attr.aria-label]="monthCloseLabel()">{{ monthCloseLabel() }}</button>
        }
        <span class="tab-version">v{{ version }}</span>
        @if (!isYearClosed() && !(selected() && isMonthClosed(selected()!))) {
            <bal-new-row-buttons [month]="selected() ?? undefined"/>
        }
    </div>
</div>
